version = 1
revision = 3
requires-python = ">=3.13"

[manifest]
members = [
    "elevia-cli",
    "elevia-core",
]

[[package]]
name = "elevia-cli"
version = "0.1.0"
source = { editable = "cli" }
dependencies = [
    { name = "elevia-core" },
]

[package.metadata]
requires-dist = [{ name = "elevia-core", editable = "core" }]

[[package]]
name = "elevia-core"
version = "0.1.0"
source = { editable = "core" }
